<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EducaNexo360 — Gráfico destacado 1024x500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<!--FONTS-->
<style>
  :root{
    --deep:#032b1d;
    --emerald-800:#065f46;
    --emerald-700:#047857;
    --emerald-600:#059669;
    --teal-600:#0D9488;
    --teal-400:#2DD4BF;
    --amber:#F59E0B;
    --paper:#F2FBF7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}

  /* Lienzo exacto exigido por Google Play */
  .canvas{
    position:relative;
    width:1024px;height:500px;
    overflow:hidden;
    background:
      radial-gradient(120% 140% at 88% 14%, rgba(45,212,191,.38) 0%, rgba(13,148,136,0) 55%),
      radial-gradient(90% 120% at 6% 92%, rgba(5,150,105,.45) 0%, rgba(5,150,105,0) 60%),
      linear-gradient(118deg, var(--deep) 0%, #064e3b 46%, var(--emerald-800) 74%, #0b6a5a 100%);
    font-family:'Manrope',sans-serif;
  }

  /* Trama de líneas finas: da textura sin ruido visual */
  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(80% 90% at 70% 40%, #000 20%, transparent 78%);
            mask-image:radial-gradient(80% 90% at 70% 40%, #000 20%, transparent 78%);
  }

  /* Halo diagonal de luz */
  .beam{
    position:absolute;top:-40%;left:34%;
    width:52%;height:190%;
    background:linear-gradient(94deg, rgba(255,255,255,.10), rgba(255,255,255,0) 62%);
    transform:rotate(14deg);
    filter:blur(22px);
  }

  /* Grano: rompe el degradado plano de "render de IA" */
  .grain{
    position:absolute;inset:-40%;
    opacity:.30;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.55'/></svg>");
  }

  /* ---------- Columna de texto ---------- */
  .content{
    position:absolute;left:68px;top:0;height:100%;
    width:560px;
    display:flex;flex-direction:column;justify-content:center;
    z-index:4;
  }

  .eyebrow{
    display:inline-flex;align-items:center;gap:9px;
    align-self:flex-start;
    padding:7px 15px 7px 11px;
    border:1px solid rgba(45,212,191,.42);
    border-radius:999px;
    background:rgba(4,120,87,.35);
    backdrop-filter:blur(2px);
    font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:#A7F3D0;
    margin-bottom:24px;
  }
  .eyebrow .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 4px rgba(245,158,11,.22);
  }

  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:900;
    font-size:78px;
    line-height:.92;
    letter-spacing:-.028em;
    color:#fff;
    text-shadow:0 8px 34px rgba(0,0,0,.34);
  }
  h1 .num{
    background:linear-gradient(96deg,var(--teal-400),#7BE7C7);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .rule{
    width:78px;height:3px;margin:22px 0 20px;
    background:linear-gradient(90deg,var(--amber),rgba(245,158,11,0));
    border-radius:2px;
  }

  .tagline{
    font-size:25px;font-weight:500;line-height:1.32;
    color:rgba(236,253,245,.9);
    max-width:470px;
  }
  .tagline b{font-weight:700;color:#fff}

  .pills{display:flex;gap:9px;margin-top:26px}
  .pill{
    padding:8px 15px;border-radius:9px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);
    font-size:14.5px;font-weight:700;color:#D1FAE5;
    letter-spacing:.01em;
  }

  /* ---------- Bloque del ícono ---------- */
  /* El logo YA es un ícono redondeado con su propia red de nodos: se muestra
     tal cual, sin tarjeta que lo envuelva ni órbitas que repitan el motivo. */
  .mark{
    position:absolute;right:118px;top:50%;
    transform:translateY(-50%);
    z-index:4;
  }
  .bloom{
    position:absolute;left:50%;top:50%;
    width:470px;height:470px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(125,240,205,.34) 0%, rgba(45,212,191,.16) 42%, transparent 68%);
    filter:blur(10px);
  }
  /* Verde sobre verde pierde contraste: el anillo claro lo despega del fondo */
  .tile{
    position:relative;
    width:218px;height:218px;
    border-radius:48px;
    overflow:hidden;
    box-shadow:
      0 34px 64px -20px rgba(0,0,0,.62),
      0 0 0 2px rgba(255,255,255,.30),
      0 0 44px rgba(45,212,191,.30);
  }
  .tile img{display:block;width:100%;height:100%;object-fit:cover}

  /* Tarjeta flotante de notificación */
  .toast{
    position:absolute;
    display:flex;align-items:center;gap:11px;
    padding:11px 16px 11px 12px;
    border-radius:14px;
    background:rgba(255,255,255,.97);
    box-shadow:0 16px 34px -12px rgba(0,0,0,.55);
    white-space:nowrap;
  }
  .toast .ico{
    width:30px;height:30px;border-radius:9px;
    display:grid;place-items:center;
    background:linear-gradient(140deg,var(--emerald-600),var(--teal-600));
  }
  .toast .ico svg{width:16px;height:16px;fill:#fff}
  .toast .txt{display:flex;flex-direction:column;line-height:1.15}
  .toast .t1{font-size:13.5px;font-weight:700;color:#064e3b}
  .toast .t2{font-size:11.5px;font-weight:500;color:#0d9488}

  /* Un solo aviso, dentro del margen seguro (Google escala y recorta la imagen) */
  .toast.one{bottom:-16px;left:-118px}
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="beam"></div>

  <div class="content">
    <span class="eyebrow"><span class="dot"></span>Agenda escolar digital</span>
    <h1>EducaNexo<span class="num">360</span></h1>
    <div class="rule"></div>
    <p class="tagline">El colegio <b>en tus manos</b>.<br>Notas, tareas y mensajes al instante.</p>
    <div class="pills">
      <span class="pill">Calificaciones</span>
      <span class="pill">Tareas</span>
      <span class="pill">Mensajería</span>
    </div>
  </div>

  <div class="mark">
    <div class="bloom"></div>

    <div class="tile"><img src="../assets/images/logo_icono_nuevo.png" alt="EducaNexo360"></div>

    <div class="toast one">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2 3 7l9 5 9-5-9-5Zm0 12.7L4.6 10.6 3 11.5l9 5 9-5-1.6-.9L12 14.7Z"/></svg></span>
      <span class="txt"><span class="t1">Nueva calificación</span><span class="t2">Matemáticas · 4.6</span></span>
    </div>
  </div>

  <div class="grain"></div>
</div>
</body>
</html>
