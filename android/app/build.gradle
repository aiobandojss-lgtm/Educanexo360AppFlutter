plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Leer keystore de producción desde key.properties (NO versionar este archivo)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasKeystoreConfig = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
    // OJO: file() dentro de app/build.gradle resuelve desde android/app/, pero storeFile
    // se escribe relativo a android/ (rootProject). Usar rootProject.file evita que la
    // ruta falle y el build caiga en silencio a la firma de debug.
    def jksFile = rootProject.file(keystoreProperties['storeFile'])
    hasKeystoreConfig = jksFile.exists()
    if (!hasKeystoreConfig) {
        println "AVISO: key.properties apunta a un keystore inexistente: ${jksFile.absolutePath}"
    }
}

// Un .aab/.apk de release firmado con la clave de debug es rechazado por Play Store.
// Antes esto pasaba en silencio; ahora el build falla y se ve el motivo.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name ==~ /(?i).*(assemble|bundle)release.*/ }
    if (buildingRelease && !hasKeystoreConfig) {
        throw new GradleException(
            "No se puede firmar el release: falta el keystore de produccion.\n" +
            "Revisa android/key.properties (storeFile es relativo a la carpeta android/) " +
            "y que el archivo .jks exista."
        )
    }
}

android {
    namespace "com.educanexo360.app"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (hasKeystoreConfig) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.educanexo360.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            signingConfig hasKeystoreConfig ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        // Fuerza versión compatible de browser para no requerir AGP 8.9.1+
        force 'androidx.browser:browser:1.8.0'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
